name: Refresh Ubuntu base
on:
  schedule:
    # Check every six hours, plus on-demand during a CVE wave.
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ubuntu-snapshot-bump
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:

  bump:
    runs-on: ubuntu-latest
    steps:

    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.repository.default_branch }}

    - name: Find existing bump PR
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BASE_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        BRANCH="chore/bump-ubuntu-snapshot"
        PR="$(gh pr list --state open --base "${BASE_BRANCH}" --head "${BRANCH}" \
          --json number,isCrossRepository \
          --jq '[.[] | select(.isCrossRepository == false)] | first // empty')"
        if [ -n "${PR}" ]; then
          echo "number=$(jq -r '.number' <<< "${PR}")" >> "$GITHUB_OUTPUT"
          git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          git checkout -b "${BRANCH}" "origin/${BRANCH}"
        else
          # Fetch a leftover closed/merged PR branch for the push lease.
          REMOTE="$(git ls-remote --heads origin "refs/heads/${BRANCH}")"
          if [ -n "${REMOTE}" ]; then
            git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          fi
          git checkout -b "${BRANCH}"
        fi
        echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

    - name: Refresh Ubuntu image digest and snapshot if changed
      id: bump
      shell: bash
      run: python3 .github/scripts/bump-ubuntu-snapshot.py

    - name: Create or update bump PR
      if: steps.bump.outputs.updated == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BASE_BRANCH: ${{ github.event.repository.default_branch }}
        BRANCH: ${{ steps.pr.outputs.branch }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        SNAPSHOT: ${{ steps.bump.outputs.snapshot }}
        DIGEST: ${{ steps.bump.outputs.digest }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add Dockerfile
        TITLE="chore(deps): refresh Ubuntu base image and snapshot"
        BODY="Refresh the Ubuntu base pins: image digest ${DIGEST}, archive snapshot ${SNAPSHOT}. The multi-platform image digest or package-index SHA256 checksums changed. Unchanged pins are preserved. Checked every six hours, or manually during a CVE wave."
        git commit -m "${TITLE}"
        if [ -n "${PR_NUMBER}" ]; then
          git push origin "${BRANCH}"
          gh pr edit "${PR_NUMBER}" --title "${TITLE}" --body "${BODY}"
        else
          git push --force-with-lease --set-upstream origin "${BRANCH}"
          gh pr create --base "${BASE_BRANCH}" --head "${BRANCH}" --title "${TITLE}" --body "${BODY}"
        fi
