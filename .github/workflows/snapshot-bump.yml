name: Bump Ubuntu snapshot
on:
  schedule:
    # Monthly plus on-demand (workflow_dispatch, e.g. during a CVE wave):
    # pick up Ubuntu security updates via a fresh snapshot
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:

  bump:
    runs-on: ubuntu-latest
    steps:

    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Bump ARG_UBUNTU_SNAPSHOT to the current time
      id: bump
      shell: bash
      run: |
        set -euo pipefail
        # Full current UTC time (not just the month): a manual dispatch during
        # a CVE wave picks up fixes published hours ago instead of waiting for
        # the next month. Any timestamp after 2023-03-01 resolves on
        # snapshot.ubuntu.com, including the current minute (verified).
        SNAPSHOT="$(date -u +%Y%m%dT%H%M%SZ)"
        CURRENT="$(sed -n -E 's/^ARG ARG_UBUNTU_SNAPSHOT="([^"]+)".*/\1/p' Dockerfile)"
        echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
        echo "snapshot=${SNAPSHOT}" >> "$GITHUB_OUTPUT"
        if [ "${CURRENT}" != "${SNAPSHOT}" ]; then
          sed -i -E "s/^ARG ARG_UBUNTU_SNAPSHOT=\"[^\"]+\"/ARG ARG_UBUNTU_SNAPSHOT=\"${SNAPSHOT}\"/" Dockerfile
          echo "updated=true" >> "$GITHUB_OUTPUT"
        else
          echo "updated=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Open bump PR
      if: steps.bump.outputs.updated == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        BRANCH="chore/bump-ubuntu-snapshot-${{ steps.bump.outputs.snapshot }}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout -b "${BRANCH}"
        git add Dockerfile
        git commit -m "chore(deps): bump Ubuntu snapshot to ${{ steps.bump.outputs.snapshot }}"
        git push --set-upstream origin "${BRANCH}"
        gh pr create --fill --title "chore(deps): bump Ubuntu snapshot to ${{ steps.bump.outputs.snapshot }}" --body "Refresh of the snapshot-pinned Ubuntu archive view so security updates flow into the agent image (scheduled monthly, or manually during a CVE wave). CI builds the image from the new snapshot for validation."
