name: Release
on: 
  workflow_dispatch: 
    inputs: 
      version: 
        description: 'Release tag without v'
        required: true
      docker-tag: 
        description: 'Docker tag'
        required: true

    
env:
  DOCKER_REPO_TAG: "btungut/azure-devops-agent:${{ github.event.inputs.docker-tag }}"


permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:

    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: docker login
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: docker build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: src
        file: ./Dockerfile
        push: true
        pull: true
        tags: ${{ env.DOCKER_REPO_TAG }}

  release:
    permissions:
      contents: write  # for softprops/action-gh-release to create GitHub release
    runs-on: ubuntu-latest
    needs: [validate]
    if: success('validate')
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: helm_install
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v3.17.0

    - name: helm_package
      shell: bash
      run: |
        set -euo pipefail

        helm dep update .
        helm package .
        helm repo index .

        cat index.yaml >> $GITHUB_STEP_SUMMARY
      working-directory: chart

    - name: upload_artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: chart
        path: chart/*.tgz

    - name: create_github_release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: |
          chart/*.tgz
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ github.event.inputs.version }}
        generate_release_notes: true
        prerelease: false
        draft: true