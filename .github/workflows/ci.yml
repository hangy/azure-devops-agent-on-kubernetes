name: PR Validation
on:
  pull_request:
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"

run-name: ${{ github.event.pull_request.title }} - ${{ github.sha }}

env:
  DOCKER_BUILDKIT: 1
  DOCKER_REPO_TAG: "azure-devops-agent:${{ github.sha }}"

permissions:
  contents: read

jobs:

  validate:
    runs-on: ubuntu-latest
    steps:

    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # - name: docker login
    #   uses: docker/login-action@v3
    #   with:
    #     username: ${{ secrets.DOCKERHUB_USERNAME }}
    #     password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: docker build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: src
        file: ./Dockerfile
        # push: true
        push: false
        tags: ${{ env.DOCKER_REPO_TAG }}